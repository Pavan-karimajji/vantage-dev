  - expect: C-LAYER-EMPTY
    file: layers.yaml
    why: >-
      a layer declared but never populated -- you said you would write it and
      did not. Planted by pointing the layer at a document that exists but
      holds no requirements: a requirement UID is four digits, a test id two,
      so the test spec parses as zero requirements for this layer.
    find: |-
      doc: SBR_Software_Requirements.md
    replace: |-
