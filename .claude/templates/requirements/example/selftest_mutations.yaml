  # -- R-REQ-17 supporting documents -----------------------------------------
  - expect: C-CONTEXT-MISSING
    file: layers.yaml
    why: a declared supporting document that is not there
    find: |-
          doc: SBR_Concept.md
    replace: |-
          doc: SBR_Concept_gone.md

  - expect: C-CONTEXT-KIND
    file: layers.yaml
    why: a kind outside the closed vocabulary — an open list becomes a junk drawer
    find: |-
        - kind: architecture
    replace: |-
      - kind: notes

  - expect: C-CONTEXT-UNREF
    file: SBR_Stakeholder_Requirements.md
    why: >-
      a supporting document nothing in the set cites. It goes on looking true
      long after the set stopped agreeing with it — the stale-contract failure.
    find: |-
      is `SBR_Concept.md` (`R-REQ-17`). It carries the reasoning and no obligation;
    replace: |-
      is the concept note. It carries the reasoning and no obligation;

  - expect: C-CONTEXT-UID
    file: SBR_Concept.md
    why: >-
      a supporting document allocating a requirement row. Citing a UID is how
      this document connects to the set; defining one puts an obligation in two
      places (R-REQ-1).
    find: |-
      ## 1. The problem
    replace: |-
      **`STK-0009`** · `P0` · `R1` — a row that has no business being here
      **Shall.** The system shall do something this document has no right to require.

      ## 1. The problem

  # ---- the DECLARATION's own shape (C-SPEC-*) ----------------------------
  # layers.yaml is the one file an author writes from scratch, so it is where
  # the mistakes will be. These four prove a malformed declaration reports a
  # finding rather than a Python traceback.

  - expect: C-SPEC-TYPE
    file: layers.yaml
    why: >-
      `items:` written as a list of id/name pairs instead of the id-to-
      description mapping the checker reads. Both shapes look reasonable and
      only one is read, which is why the finding names the fix.
    find: |-
      items:
        belt:  Belt-buckle state debounce
        occ:   Seat-occupancy debounce
        gate:  Speed and availability gating
        esc:   Escalation timer
        state: Reminder latch and clear
        calib: Calibration read from the config bundle
    replace: |-
      items:
        - id: belt
        - id: occ
        - id: gate
        - id: esc
        - id: state
        - id: calib

  - expect: C-SPEC-MISSING
    file: layers.yaml
    why: >-
      a required key absent. The tests a set declares have nowhere to live, so
      every downstream check would index into a spec that cannot answer.
    find: |-
      test_spec: SBR_Test_Spec.md
    replace: |-
      # test_spec removed

  - expect: C-SPEC-DUP
    file: layers.yaml
    why: >-
      two layers sharing an id. A layer id is its UID prefix, so a duplicate
      silently merges two layers' requirements into one namespace (R-REQ-2).
    find: |-
      layers:
        - id: STK
    replace: |-
      layers:
        - id: SYS

  - expect: C-SPEC-PARSE
    file: layers.yaml
    why: >-
      a declaration that does not parse — the mistake that used to surface as a
      raw PyYAML traceback before any check ran. The reported finding keeps
      PyYAML's own line and column, because that is the part an author needs.
    find: |-
      module: SBR
    replace: |-
      - module: SBR

  - expect: C-SKIPWHY
    file: SBR_Software_Requirements.md
    why: a declared layer skip that does not say why, in the row itself
    find: |-
      `STK-0005` (skips SYS: the whole obligation sits inside one software item and states no vehicle-level boundary behaviour of its own)
    replace: |-
      `STK-0005`

  - expect: C-PARENT
    file: layers.yaml
    why: a skip taken without the layer declaring it may
    find: |-
      may_skip_from: [STK]
    replace: |-
      may_skip_from: []

  - expect: C-SKIPDECL
    file: layers.yaml
    why: a skip declared to the layer directly above, which is the ordinary parent
    find: |-
      may_skip_from: [STK]
    replace: |-
      may_skip_from: [SYS]
