# Planted violations for `trace_check.py --selftest` (R-REQ-9).
#
# Declared here, beside layers.yaml, never inside trace_check.py -- the checker
# must contain no module's document names, or "copy it to any module" is not
# true. Each entry makes one edit to a throwaway copy of this directory and
# asserts the named check catches it.
#
# A check nobody has seen fail is a check nobody should believe.

mutations:
  - expect: C-DANGLING
    file: SBR_System_Requirements.md
    why: a trace to a UID that does not exist
    find: |-
      **Verify.** T · `SYT-SBR-01`   **Trace.** `STK-0001`
    replace: |-
      **Verify.** T · `SYT-SBR-01`   **Trace.** `STK-9999`

  - expect: C-TWOWAY
    file: SBR_Test_Spec.md
    why: the two halves of a link disagreeing
    find: |-
      **Serves.** `SYS-0002`
    replace: |-
      **Serves.** `SYS-0003`

  - expect: C-STATUS
    file: SBR_Stakeholder_Requirements.md
    why: a Status field smuggled into a specification
    find: |-
      **Shall.** The system shall remind an occupant
    replace: |-
      **Status.** frozen
      **Shall.** The system shall remind an occupant

  - expect: C-BINDS
    file: SBR_System_Requirements.md
    why: a boundary requirement bound to an undeclared port
    find: |-
      **Binds.** `occupancy`, `sbr.outputs`
    replace: |-
      **Binds.** `not_a_port`

  - expect: C-ITEM
    file: SBR_Software_Requirements.md
    why: a software item invented at the point of use
    find: |-
      **Item.** `esc`
    replace: |-
      **Item.** `not_an_item`

  - expect: C-HEADLINE
    file: SBR_Stakeholder_Requirements.md
    why: a headline over the character cap
    find: |-
      — Stay silent for an empty seat
    replace: |-
      — Stay silent for an empty seat, and also say a great deal more than any headline needs to say about it

  - expect: C-WORDS
    file: SBR_System_Requirements.md
    why: Shall plus Accept over the word cap, which means more than one obligation
    find: |-
      **Shall.** The component shall clear the reminder within one cycle of the belt becoming buckled.
    replace: |-
      **Shall.** The component shall clear the reminder within one cycle of the belt becoming buckled, and shall also record the clearing time, and shall report the clearing reason, and shall keep a count of clearings, and shall expose that count on a diagnostic port, and shall reset the count at ignition, and shall do all of this within the same cycle without any additional latency whatsoever.

  - expect: C-ORPHAN
    file: SBR_Software_Requirements.md
    why: a requirement with no test -- unverifiable as written
    find: |-
      **Verify.** T · `UT-state-01`   **Trace.** `SYS-0001`, `SYS-0005`
    replace: |-
      **Trace.** `SYS-0001`, `SYS-0005`

  - expect: C-NOPLANT
    file: SBR_Test_Spec.md
    why: an A-method check with no planted-violation case
    find: |-
      - `.c2` **PASS:** the planted violation is reported
    replace: |-
      - `.cX` **PASS:** the planted violation is reported

  - expect: C-CATEGORY
    file: SBR_Stakeholder_Requirements.md
    why: a category the module does not declare
    find: |-
      **Category.** `feature`
      **Verify.** T · `STT-03`
    replace: |-
      **Category.** `safety`
      **Verify.** T · `STT-03`

  - expect: C-KPI-UNMEASURED
    file: SBR_Stakeholder_Requirements.md
    why: a KPI whose Accept states no number and no cannot-measure mark
    find: |-
      **Accept.** Over the acceptance corpus, reminders raised while every occupied seat is belted occur at most `⊘` times per 100 hours.
    replace: |-
      **Accept.** Over the acceptance corpus, false reminders shall be rare.

  - expect: C-CATEGORY-EMPTY
    file: layers.yaml
    why: a category declared but populated by nothing
    find: |-
        categories: [feature, kpi]
    replace: |-
        categories: [feature, kpi, safety]

